# Alert definitions for detections D005-D011 (web_lab / fw_lab).
# Deploy to $SPLUNK_HOME/etc/apps/<app>/local/savedsearches.conf or recreate via Settings > Searches, reports, and alerts.
# The lab data is historical (June 2025), so these are NOT enabled on the trial instance - a live schedule
# over "last N minutes" would never see the events. Detection logic was validated by running each search over all time.
#
# Conventions: search window = schedule interval (no gaps/overlap), per-entity throttling, severity 1-5 (5 = critical).

[D005 - Web login brute force]
search = index=web_lab sourcetype=web:access resource="/login" status_code=401 | stats count AS failed_logins values(user_agent) AS ua BY client_ip | where failed_logins >= 20
dispatch.earliest_time = -10m@m
dispatch.latest_time = @m
cron_schedule = */10 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.suppress = 1
alert.suppress.fields = client_ip
alert.suppress.period = 1h
alert.severity = 4
alert.track = 1
action.email = 0

[D006 - HTTP 404 spike]
search = index=web_lab sourcetype=web:access status_code=404 | stats count AS errors_404 BY client_ip | eventstats sum(errors_404) AS total_404 | where total_404 > 20 | sort - errors_404 | head 1
dispatch.earliest_time = -5m@m
dispatch.latest_time = @m
cron_schedule = */5 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.suppress = 1
alert.suppress.period = 30m
alert.severity = 3
alert.track = 1

[D007 - Web content discovery]
search = index=web_lab sourcetype=web:access status_code=404 | stats count AS errors_404 dc(resource) AS distinct_paths values(user_agent) AS ua BY client_ip | where distinct_paths >= 10
dispatch.earliest_time = -5m@m
dispatch.latest_time = @m
cron_schedule = */5 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.suppress = 1
alert.suppress.fields = client_ip
alert.suppress.period = 1h
alert.severity = 3
alert.track = 1

[D008 - Admin denied then modified]
search = index=web_lab sourcetype=web:access (resource="/admin" OR resource="/api/*") | stats count(eval(status_code=403)) AS denied count(eval(status_code>=200 AND status_code<300 AND (method="DELETE" OR method="PUT"))) AS destructive_ok BY client_ip | where denied >= 5 AND destructive_ok >= 1
dispatch.earliest_time = -30m@m
dispatch.latest_time = @m
cron_schedule = */15 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.suppress = 1
alert.suppress.fields = client_ip
alert.suppress.period = 2h
alert.severity = 5
alert.track = 1

[D009 - Port scan]
search = index=fw_lab sourcetype=fw:traffic | stats dc(port) AS distinct_ports count(eval(action="allowed")) AS allowed BY src_ip dest_ip | where distinct_ports >= 15
dispatch.earliest_time = -5m@m
dispatch.latest_time = @m
cron_schedule = */5 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.suppress = 1
alert.suppress.fields = src_ip
alert.suppress.period = 1h
alert.severity = 3
alert.track = 1

[D010 - RDP brute force]
search = index=fw_lab sourcetype=fw:traffic port=3389 | stats count AS attempts count(eval(action="allowed")) AS allowed BY src_ip | where attempts >= 15 | eval severity=if(allowed > 0, "high", "medium")
dispatch.earliest_time = -5m@m
dispatch.latest_time = @m
cron_schedule = */5 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.suppress = 1
alert.suppress.fields = src_ip
alert.suppress.period = 1h
alert.severity = 4
alert.track = 1

[D011 - Large outbound transfer]
search = index=fw_lab sourcetype=fw:traffic action=allowed | where NOT (cidrmatch("10.0.0.0/8", dest_ip) OR cidrmatch("172.16.0.0/12", dest_ip) OR cidrmatch("192.168.0.0/16", dest_ip)) | stats sum(bytes) AS bytes_out BY src_ip dest_ip | where bytes_out >= 50000000 | eval MB_out=round(bytes_out/1024/1024, 1)
dispatch.earliest_time = -10m@m
dispatch.latest_time = @m
cron_schedule = */10 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.suppress = 1
alert.suppress.fields = src_ip,dest_ip
alert.suppress.period = 4h
alert.severity = 5
alert.track = 1

[Report - Daily web error rate]
# Replaces the IBM "Daily HTTP Error Summary": hourly error RATE by status class instead of one daily bar of raw counts.
search = index=web_lab sourcetype=web:access | bin _time span=1h | stats count AS requests count(eval(status_code>=400 AND status_code<500)) AS e4xx count(eval(status_code>=500)) AS e5xx BY _time | eval pct_4xx=round(100*e4xx/requests,1), pct_5xx=round(100*e5xx/requests,1)
dispatch.earliest_time = -1d@d
dispatch.latest_time = @d
cron_schedule = 45 8 * * *
enableSched = 1

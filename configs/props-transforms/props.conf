# Search-time field extraction for the Linux secure log (sourcetype secure-2).
# Deploying this removes the need for the inline `rex` in the dashboard and D002/D003.
# NOT yet deployed to the Splunk Cloud instance - searches currently use inline rex.
[secure-2]
EXTRACT-ssh_auth = \d\d:\d\d:\d\d (?<dest>\S+) sshd\[\d+\]: (?<action>Failed|Accepted) password for (?<invalid>invalid user )?(?<user>\S+) from (?<src_ip>[\d\.]+) port (?<src_port>\d+)
